name: Decompile DTs (No Modify)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dtb/original/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Decompile original DTB → DTS
        run: |
          mkdir -p out
          dtc -I dtb -O dts -o out/meson-gxl-s905l3b-m302a.dts \
            dtb/original/meson-gxl-s905l3b-m302a.dtb

      - name: Show CMA node (read-only)
        run: |
          echo "=== CMA node in decompiled DTS ==="
          grep -A4 'linux,cma' out/meson-gxl-s905l3b-m302a.dts || echo "linux,cma node not found"

      - name: Upload decompiled DTS
        uses: actions/upload-artifact@v4
        with:
          name: dtb-decompiled
          path: out/meson-gxl-s905l3b-m302a.dts
