
name: Build DTs (CMA 64M)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dtb/original/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Decompile original DTB → DTS
        run: |
          mkdir -p build
          dtc -I dtb -O dts -o build/board.dts \
            dtb/original/meson-gxl-s905l3b-m302a.dtb

      - name: Patch CMA to 64M
        run: |
          sed -i '/linux,cma/,/size/{s/0x10000000/0x04000000/}' build/board.dts
          grep -A4 'linux,cma' build/board.dts

      - name: Compile DTS → DTB
        run: |
          mkdir -p out
          dtc -I dts -O dtb -o out/meson-gxl-s905l3b-m302a.dtb build/board.dts

      - name: Verify - Decompile final DTB back to DTS
        run: |
          dtc -I dtb -O dts -o out/board-verified.dts out/meson-gxl-s905l3b-m302a.dtb
          echo "=== CMA node in final DTB ==="
          grep -A4 'linux,cma' out/board-verified.dts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtb-cma64m
          path: |
            out/meson-gxl-s905l3b-m302a.dtb
            out/board-verified.dts
