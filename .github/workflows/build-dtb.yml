name: Build DTB

on:
  workflow_dispatch:
  push:
    paths:
      - 'dtb/original/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Compile DTS → DTB
        run: |
          mkdir -p out
          dtc -I dts -O dtb -o out/meson-gxl-s905l3b-m302a.dtb \
            dtb/original/meson-gxl-s905l3b-m302a.dts

      - name: Verify - Decompile back to DTS
        run: |
          dtc -I dtb -O dts -o out/board-verified.dts out/meson-gxl-s905l3b-m302a.dtb
          echo "=== CMA node ==="
          grep -A4 'linux,cma' out/board-verified.dts
          echo "=== Memory node ==="
          grep -A2 'memory@' out/board-verified.dts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtb
          path: |
            out/meson-gxl-s905l3b-m302a.dtb
            out/board-verified.dts
